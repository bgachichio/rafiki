# .pre-commit-config.yaml - the commit gate every project ships (building §7, developer §8.1 rule 3).
# Copy to the project root, then run once per clone:  pre-commit install
# Revs are pinned to commit SHAs (developer §8.3). Bump them deliberately: pre-commit autoupdate --freeze
# Python is optional: drop the ruff block on a project with no Python.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: privacy-scan
        name: privacy scan (private deny-list, skipped when absent)
        entry: ./scripts/privacy-scan.sh
        language: system
        pass_filenames: false
        always_run: true
